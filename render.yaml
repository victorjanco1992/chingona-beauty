services:
  - type: web
    name: chingona-beauty-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_CURRENCY
        value: ARS
      - key: VITE_LOCALE
        value: es-AR
